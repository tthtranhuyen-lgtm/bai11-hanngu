    <script>
      // Prevent extensions from failing when patching window.fetch
      (function() {
        try {
          var _origFetch = window.fetch ? window.fetch.bind(window) : null;
          var _fetch = _origFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _fetch;
            },
            set: function(val) {
              _fetch = val;
            }
          });
        } catch (_) {}
      })();
    </script>
